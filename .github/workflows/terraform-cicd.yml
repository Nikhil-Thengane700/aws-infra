name: Terraform CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AWS_REGION: 'us-east-1'
  TF_VERSION: '1.12.2'      
  TFLINT_VERSION: '0.62.1'  
  TFSEC_VERSION: '1.28.1'

jobs:
  # ✅ JOB 1 — Plan Job
  terraform-plan:
    name: 'Terraform Lint, Security Check & Plan'
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout GitHub repository'
        uses: actions/checkout@v4                             # ✅ FIX: was @v2

      - name: 'Configure AWS credentials'
        uses: aws-actions/configure-aws-credentials@v4       # ✅ FIX: was @v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 'Set up Terraform'
        uses: hashicorp/setup-terraform@v3                   # ✅ FIX: was @v1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: 'Install TFLint'
        run: |
          curl -sLo tflint.zip https://github.com/terraform-linters/tflint/releases/download/v${{ env.TFLINT_VERSION }}/tflint_linux_amd64.zip
          unzip tflint.zip -d /usr/local/bin/

      - name: 'Install tfsec'
        run: |
          curl -sLo tfsec https://github.com/aquasecurity/tfsec/releases/download/v${{ env.TFSEC_VERSION }}/tfsec-linux-amd64
          chmod +x tfsec
          mv tfsec /usr/local/bin/

      - name: 'Terraform Init'
        run: tf

      - name: 'Terraform Format Check'
        run: terraform fmt -check -no-color        # ✅ FIX: was `terraform fmt` (silently reformatted, never committed)

      - name: 'Terraform Validate'
        run: terraform validate -no-color

      - name: 'TFLint'
        run: |
          tflint --init
          tflint

      - name: 'tfsec'
        run: tfsec . --no-color

      # ✅ Save plan as binary AND capture human-readable output
      - name: 'Terraform Plan'
        run: |
          terraform plan -out=tfplan -no-color 2>&1 | tee plan_output.txt    # ✅ FIX: added -no-color

      # ✅ Upload binary plan file to S3
      - name: 'Upload Binary Plan to S3'
        run: |
          aws s3 cp tfplan s3://${{ secrets.TF_LOGS_BUCKET }}/plans/${{ github.run_id }}/tfplan

      # ✅ Upload human-readable plan output to S3
      - name: 'Upload Plan Output to S3'
        run: |
          aws s3 cp plan_output.txt s3://${{ secrets.TF_LOGS_BUCKET }}/plans/${{ github.run_id }}/plan_output.txt

      # ✅ Write email body to a temp file, then pass via `file://` — avoids shell injection from plan output
      - name: 'Send Plan Output Email to Manager'
        run: |
          cat > /tmp/email_body.txt << EOF
          Hi Manager,

          Terraform plan is ready for review.

          Triggered by: ${{ github.actor }}
          Branch: ${{ github.ref }}
          Run ID: ${{ github.run_id }}

          ===== PLAN OUTPUT =====
          $(cat plan_output.txt)
          =======================

          IMPORTANT: If you approve, Terraform will apply
          EXACTLY this plan — no recalculation, no surprises.

          Approve here:
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Approval expires in 24 hours.

          Regards,
          DevOps Pipeline
          EOF

          # ✅ FIX: correct SES CLI flags — was using --to and --text which don't exist
          aws ses send-email \
            --from "nikhil.thengane01@gmail.com" \
            --destination "ToAddresses=${{ secrets.MANAGER_EMAIL }}" \
            --message "Subject={Data=[ACTION REQUIRED] Terraform Plan - Run #${{ github.run_id }},Charset=UTF-8},Body={Text={Data=$(cat /tmp/email_body.txt),Charset=UTF-8}}" \
            --region ${{ env.AWS_REGION }}

  # ✅ JOB 2 — Apply Job
  # Waits for manual approval via GitHub Environment protection rule
  # Downloads and applies EXACT saved plan from S3
  terraform-apply:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.ref == 'refs/heads/main'

    # 🔐 Manager must approve here before apply runs
    environment: production

    steps:
      - name: 'Checkout GitHub repository'
        uses: actions/checkout@v4                            # ✅ FIX: was @v2

      - name: 'Configure AWS credentials'
        uses: aws-actions/configure-aws-credentials@v4      # ✅ FIX: was @v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 'Set up Terraform'
        uses: hashicorp/setup-terraform@v3                  # ✅ FIX: was @v1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: 'Terraform Init'
        run: terraform init -no-color

      # ✅ Download the EXACT same plan that was reviewed
      - name: 'Download Approved Plan from S3'
        run: |
          aws s3 cp s3://${{ secrets.TF_LOGS_BUCKET }}/plans/${{ github.run_id }}/tfplan tfplan

      # ✅ Apply EXACTLY the saved plan — nothing more, nothing less
      - name: 'Terraform Apply Saved Plan'
        run: |
          terraform apply -no-color tfplan 2>&1 | tee apply_output.txt

      # ✅ Upload apply output to S3
      - name: 'Upload Apply Output to S3'
        run: |
          aws s3 cp apply_output.txt s3://${{ secrets.TF_LOGS_BUCKET }}/applies/${{ github.run_id }}/apply_output.txt

      # ✅ Send success confirmation email
      - name: 'Send Apply Success Email'
        if: success()
        run: |
          aws ses send-email \
            --from "nikhil.thengane01@gmail.com" \
            --destination "ToAddresses=${{ secrets.MANAGER_EMAIL }}" \
            --message "Subject={Data=✅ Terraform Apply Successful - Run #${{ github.run_id }},Charset=UTF-8},Body={Text={Data=Hi Manager. Terraform apply completed successfully. The exact plan you approved has been applied. Approved by: ${{ github.actor }}. Run ID: ${{ github.run_id }}. Plan logs: s3://${{ secrets.TF_LOGS_BUCKET }}/plans/${{ github.run_id }}/plan_output.txt Apply logs: s3://${{ secrets.TF_LOGS_BUCKET }}/applies/${{ github.run_id }}/apply_output.txt,Charset=UTF-8}}" \
            --region ${{ env.AWS_REGION }}

      # ✅ Send failure email if apply fails
      - name: 'Send Apply Failure Email'
        if: failure()
        run: |
          aws ses send-email \
            --from "nikhil.thengane01@gmail.com" \
            --destination "ToAddresses=${{ secrets.MANAGER_EMAIL }}" \
            --message "Subject={Data=❌ Terraform Apply FAILED - Run #${{ github.run_id }},Charset=UTF-8},Body={Text={Data=Hi Manager. Terraform apply has FAILED. Please investigate immediately. Run ID: ${{ github.run_id }}. Apply logs: s3://${{ secrets.TF_LOGS_BUCKET }}/applies/${{ github.run_id }}/apply_output.txt,Charset=UTF-8}}" \
            --region ${{ env.AWS_REGION }}